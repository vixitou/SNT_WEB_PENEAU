<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>Le Web et le protocole IP</title>
</head>
<body>
  <header>
    <h1>Le Web et le protocole IP</h1>
    <p class="subtitle">Cours et exercices</p>
  </header>

  <main>
    <section id="password-exercise" aria-labelledby="password-exercise-title">
      <h2 id="password-exercise-title">Défi — trouver le mot de passe</h2>
      <p>
        Examine le code de cette page pour découvrir le mot de passe, puis saisis-le
        pour afficher la récompense.
      </p>
      <div class="password-form">
        <label for="password">Mot de passe</label>
        <div class="password-entry">
          <input id="password" name="password" type="password" autocomplete="off">
          <button type="button" onclick="verifierMotDePasse()">Valider</button>
        </div>
        <p id="password-error" class="password-error" role="alert" hidden>
          Ce n’est pas le bon mot de passe. Réessaie !
        </p>
      </div>
    </section>

  </main>

  <script>
    const expectedPassword = "webRenaudeau";
    const expectedPassword2 = "webRenaudeau2";
    const expectedPassword3 = "webRenaudeau3";
    const expectedPassword4 = "webRenaudeau4";
    const expectedPassword5 = "webRenaudeau5";

    function verifierMotDePasse() {
      const enteredPassword = document.getElementById("password").value;

      if (enteredPassword === expectedPassword4) {
        document.getElementById("password-exercise").innerHTML =
          '<div class="reward-card">' +
          '<h2>Félicitations !</h2>' +
          '<img class="reward-image" src="recompense.svg" alt="">' +
          '<p>Tu as gagné <strong>1 point</strong> sur ton évaluation ! explique au professeur comment tu as fait pour récupérer le point</p>' +
          '</div>';
        return;
      }

      document.getElementById("password-error").innerHTML =
        "Ce n’est pas le bon mot de passe. Réessaie !";
      document.getElementById("password-error").hidden = false;
    }
  </script>
</body>
</html>
